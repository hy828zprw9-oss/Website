<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Visitenkarte SPN-Transporte</title>
<style>
@font-face { font-family: "Saira"; src: url("../../assets/fonts/saira-latin-wdth-italic.woff2") format("woff2"); font-style: italic; font-weight: 100 900; font-stretch: 50% 125%; }
@font-face { font-family: "Geist"; src: url("../../assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
@page { size: 91mm 61mm; margin: 0; }
:root { --red: #d0111f; --black: #0b0b0c; --grey: #a1a1a6; --white: #f5f5f7; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fff; }
body { font-family: "Geist", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
/* 91 × 61 mm = 85 × 55 mm Endformat + 3 mm Beschnitt rundum */
.card { position: relative; width: 91mm; height: 61mm; overflow: hidden; background: var(--black); color: var(--white); page-break-after: always; }
.safe { position: absolute; inset: 6.5mm; } /* 3 mm Beschnitt + 3.5 mm Sicherheitsabstand */
.wordmark { font-family: "Saira"; font-style: italic; font-weight: 850; font-stretch: 125%; text-transform: uppercase; color: var(--red); letter-spacing: 0; line-height: 1; }
/* Randstein wie an der Rennstrecke */
.kerb { position: absolute; background: repeating-linear-gradient(90deg, var(--red) 0 5mm, var(--white) 5mm 10mm); }

/* Vorderseite */
.front .truck { position: absolute; right: -9mm; bottom: 4.2mm; height: 46mm; }
.front .services { position: absolute; left: 0; bottom: 1.5mm; font-size: 2.2mm; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--white); }
.front .services i { font-style: normal; color: var(--red); padding: 0 1.2mm; }
.front .shade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--black) 0%, var(--black) 34%, rgb(11 11 12 / 0) 62%); }
.front .wordmark { font-size: 6.4mm; }
.front .claim { margin-top: 3.2mm; font-size: 2.25mm; line-height: 1.35; font-weight: 500; color: var(--grey); max-width: 38mm; }
.front .claim b { color: var(--white); font-weight: 600; }
.front .kerb { left: 0; right: 0; bottom: 0; height: 4.2mm; }

/* Rückseite */
.back .kerb { top: 0; bottom: 0; left: 0; width: 4.2mm; background: repeating-linear-gradient(180deg, var(--red) 0 5mm, var(--white) 5mm 10mm); }
.back .safe { left: 10mm; }
.back .wordmark { font-size: 3.6mm; }
.back .name { margin-top: 6mm; font-size: 3.9mm; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
.back .role { margin-top: 0.8mm; font-size: 2.35mm; color: var(--grey); font-weight: 500; }
.back .lines { position: absolute; left: 0; bottom: 0; display: grid; gap: 1.3mm; font-size: 2.55mm; font-weight: 500; letter-spacing: -0.005em; }
.back .lines span { display: inline-block; width: 13.5mm; color: var(--red); font-weight: 650; font-size: 2.1mm; text-transform: uppercase; letter-spacing: 0.04em; }
.back .lines b { font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <section class="card front">
    <img class="truck" src="../../assets/img/actros-frei-950.webp" alt="">
    <div class="shade"></div>
    <div class="safe">
      <div class="wordmark">SPN-Transporte</div>
      <p class="claim"><b>Präzision aus dem Motorsport.</b><br>Zuverlässigkeit auf der Straße.</p>
      <p class="services">Nahverkehr<i>/</i>Shuttle</p>
    </div>
    <div class="kerb"></div>
  </section>

  <section class="card back">
    <div class="kerb"></div>
    <div class="safe">
      <div class="wordmark">SPN-Transporte</div>
      <p class="name">Vorname Nachname</p>
      <p class="role">Disposition</p>
      <div class="lines">
        <div><span>Telefon</span><b>0151 14210193</b></div>
        <div><span>E-Mail</span>spn-dispo@t-online.de</div>
        <div><span>Web</span>www.spn-transporte.de</div>
      </div>
    </div>
  </section>
</body>
</html>
