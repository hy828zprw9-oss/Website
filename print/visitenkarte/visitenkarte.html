<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Visitenkarte SPN-Transporte</title>
<style>
@font-face { font-family: "Saira"; src: url("../../assets/fonts/saira-latin-wdth-italic.woff2") format("woff2"); font-style: italic; font-weight: 100 900; font-stretch: 50% 125%; }
@font-face { font-family: "Geist"; src: url("../../assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
@page { size: 91mm 61mm; margin: 0; }
:root { --red: #d0111f; --black: #0b0b0c; --grey: #a1a1a6; --white: #f5f5f7; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fff; }
body { font-family: "Geist", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
/* 91 × 61 mm = 85 × 55 mm Endformat + 3 mm Beschnitt rundum */
.card { position: relative; width: 91mm; height: 61mm; overflow: hidden; background: var(--black); color: var(--white); page-break-after: always; }
.safe { position: absolute; inset: 6.5mm; } /* 3 mm Beschnitt + 3.5 mm Sicherheitsabstand */
.wordmark { font-family: "Saira"; font-style: italic; font-weight: 850; font-stretch: 125%; text-transform: uppercase; color: var(--red); letter-spacing: 0; line-height: 1; -webkit-text-stroke: 0.05em #050505; paint-order: stroke fill; }

/* Das Erkennungszeichen: ein schräger roter Streifen wie eine Rennlackierung, auf beiden Seiten an derselben Stelle */
.stripe { position: absolute; left: -10mm; right: -10mm; height: 9mm; background: var(--red); transform: rotate(-9deg); transform-origin: 0 50%; }

/* Vorderseite: Foto, Schriftzug, Streifen mit Leitsatz */
.front .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 78%; }
.front .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(11 11 12 / 0.85) 0%, rgb(11 11 12 / 0.3) 30%, rgb(11 11 12 / 0) 46%); }
.front .wordmark { font-size: 6.4mm; }
.front .stripe { bottom: 2mm; height: 7mm; display: flex; align-items: center; padding-left: 16.5mm; }
.front .motto { font-size: 2.55mm; font-weight: 650; letter-spacing: -0.01em; color: #fff; white-space: nowrap; }

/* Rückseite: die Telefonnummer ist der Held, so groß wie eine Startnummer */
.back .wordmark { font-size: 3.4mm; }
.back .name { margin-top: 1.6mm; font-size: 2.6mm; font-weight: 600; color: var(--grey); }
.back .number { position: absolute; left: 0; top: 13.5mm; font-family: "Saira"; font-style: italic; font-weight: 800; font-stretch: 108%; font-size: 6.7mm; line-height: 1; letter-spacing: -0.01em; color: #fff; font-variant-numeric: tabular-nums; text-decoration: none; }
.back .lines { position: absolute; left: 0; top: 24.5mm; display: grid; gap: 1.1mm; font-size: 2.45mm; font-weight: 500; }
.back .qr { position: absolute; right: 0; top: 0; width: 13.5mm; height: 13.5mm; padding: 1.2mm; background: #fff; border-radius: 1mm; }
.back .qr img { display: block; width: 100%; height: 100%; }
.back .qrlabel { position: absolute; right: 0; top: 14.5mm; width: 13.5mm; text-align: center; font-size: 1.7mm; color: var(--grey); }
.back .stripe { bottom: -2.5mm; height: 7mm; }
</style>
</head>
<body>
  <section class="card front">
    <img class="photo" src="hof-karte.jpg" alt="">
    <div class="shade"></div>
    <div class="safe">
      <div class="wordmark">SPN-Transporte</div>
    </div>
    <div class="stripe"><p class="motto">Präzision aus dem Motorsport. Zuverlässigkeit auf der Straße.</p></div>
  </section>

  <section class="card back">
    <div class="safe">
      <div class="wordmark">SPN-Transporte</div>
      <p class="name">Leonhard Schopian</p>
      <a class="number" href="tel:+4915114210193">0151 14210193</a>
      <div class="lines">
        <div>spn-dispo@t-online.de</div>
        <div>www.spn-transporte.de</div>
      </div>
      <div class="qr"><img src="vcard-qr.svg" alt=""></div>
      <p class="qrlabel">Kontakt speichern</p>
    </div>
    <div class="stripe"></div>
  </section>
</body>
</html>
